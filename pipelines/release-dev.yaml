# =============================================================================
# MyOrg -- DEV release pipeline (wrapper: build + deploy in one run)
#
# The release branch is read at run time from config/branches.json, keyed by
# env label. A scheduled run uses the defaults below, so one wrapper schedules
# one instance -- copy it and change the default to schedule another.
# =============================================================================

schedules:
- cron: '0 6 * * 1-5'                 # 06:00 UTC, Mon-Fri
  displayName: 'DEV nightly (weekdays)'
  branches:
    include: [master]
  always: false                       # skip if no commits to master since last run
# Pause without editing YAML: set schedule.enabled = false for the env in
# config/branches.json. Manual runs ignore that toggle.

trigger: none
pr: none

parameters:
- name: envInstance
  displayName: 'DEV instance'
  type: string
  default: '1'
  values: ['1', '2', '3', '4']

- name: useConfigProducts
  displayName: 'Deploy everything config lists for this env (untick to pick manually)'
  type: boolean
  default: true

# Only used when "useConfigProducts" is unticked.
- name: deployPC
  displayName: '  - PolicyCenter'
  type: boolean
  default: false
- name: deployBC
  displayName: '  - BillingCenter'
  type: boolean
  default: false
- name: deployCC
  displayName: '  - ClaimCenter'
  type: boolean
  default: false
- name: deployCM
  displayName: '  - ContactManager'
  type: boolean
  default: false

- name: forceRebuild
  displayName: 'Force rebuild (deploy even if the commit is already live)'
  type: boolean
  default: false

# Off until a webhook is set; the Notify stage still shows, marked skipped.
- name: notifyTeams
  displayName: 'Post a summary to Teams'
  type: boolean
  default: false

name: 'MyOrg-DEV${{ parameters.envInstance }}-$(Date:yyyyMMdd).$(Rev:r)'

extends:
  template: ../templates/tier-orchestrator.yml
  parameters:
    envTier: dev
    envInstance: ${{ parameters.envInstance }}
    useConfigProducts: ${{ parameters.useConfigProducts }}
    deployPC: ${{ parameters.deployPC }}
    deployBC: ${{ parameters.deployBC }}
    deployCC: ${{ parameters.deployCC }}
    deployCM: ${{ parameters.deployCM }}
    forceRebuild: ${{ parameters.forceRebuild }}
    notifyTeams: ${{ parameters.notifyTeams }}
