# =============================================================================
# MyOrg -- UAT release pipeline (wrapper: build + deploy in one run)
#
# Release branch comes from config/branches.json, keyed by env label (UAT1...).
# See release-dev.yaml for notes on how scheduling interacts with defaults.
# =============================================================================

schedules:
- cron: '0 6 * * 6'                   # 06:00 UTC, Saturday
  displayName: 'UAT weekly (Saturday)'
  branches:
    include: [master]
  always: false
# Pause/resume this schedule WITHOUT editing YAML: set schedule.enabled = false
# for the target env in config/branches.json. Manual runs ignore that toggle.

trigger: none
pr: none

parameters:
- name: envInstance
  displayName: 'UAT instance (blank = the unnumbered UAT environment)'
  type: string
  default: '1'
  # Deliberately NOT a picklist. ADO rejects an empty string in a `values:` list
  # ("Unexpected value ''"), and some estates have an unnumbered UAT alongside
  # UAT1..UATn. Free text is the only way to allow blank. Whatever is entered
  # must have a matching <TIER><INSTANCE>-<COMP> service connection and an
  # ADO environment, or the deploy fails to resolve.

- name: useConfigProducts
  displayName: 'Deploy everything config lists for this env (untick to pick manually)'
  type: boolean
  default: true

# Only used when "useConfigProducts" is unticked.
- name: deployPC
  displayName: '  - PolicyCenter'
  type: boolean
  default: false
- name: deployBC
  displayName: '  - BillingCenter'
  type: boolean
  default: false
- name: deployCC
  displayName: '  - ClaimCenter'
  type: boolean
  default: false
- name: deployCM
  displayName: '  - ContactManager'
  type: boolean
  default: false

# Bypass change detection and deploy even if this commit is already live.
- name: forceRebuild
  displayName: 'Force rebuild (deploy even if the commit is already live)'
  type: boolean
  default: false

# Teams notification. Off until a webhook is added to the variable group;
# the Notify stage still appears in the run, marked skipped.
- name: notifyTeams
  displayName: 'Post a summary to Teams'
  type: boolean
  default: false

name: 'MyOrg-UAT${{ parameters.envInstance }}-$(Date:yyyyMMdd).$(Rev:r)'

extends:
  template: ../templates/tier-orchestrator.yml
  parameters:
    envTier: uat
    envInstance: ${{ parameters.envInstance }}
    useConfigProducts: ${{ parameters.useConfigProducts }}
    deployPC: ${{ parameters.deployPC }}
    deployBC: ${{ parameters.deployBC }}
    deployCC: ${{ parameters.deployCC }}
    deployCM: ${{ parameters.deployCM }}
    forceRebuild: ${{ parameters.forceRebuild }}
    notifyTeams: ${{ parameters.notifyTeams }}
