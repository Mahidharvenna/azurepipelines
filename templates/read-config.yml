# Resolves branch + product set for an env from config/branches.json and
# publishes them as output variables for the Build and Deploy stages.
#
# Runtime, not compile time: ADO cannot read a repo file while resolving stages.
# The branch is only APPLIED at runtime (git checkout), so this works. Cron
# schedules cannot come from here -- they must be literal YAML.

parameters:
- name: envLabel                 # e.g. DEV2, QA7 -- key into branches.json
  type: string
- name: useConfigProducts        # true = deploy whatever the config lists
  type: boolean
- name: deployPC
  type: boolean
- name: deployBC
  type: boolean
- name: deployCC
  type: boolean
- name: deployCM
  type: boolean
- name: forceRebuild             # true = ignore change detection and run anyway
  type: boolean
  default: false
- name: poolName
  type: string
  default: Default

stages:
- stage: ReadConfig
  displayName: '🔍  Resolve configuration'
  jobs:
  - job: Read
    displayName: 'Parse branches.json'
    pool:
      name: ${{ parameters.poolName }}
    steps:
    - checkout: self             # the repo holding config/branches.json
    - task: PowerShell@2
      name: cfg                  # step name -> output var prefix, e.g. cfg.branch_pc
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: 'Resolve config for ${{ parameters.envLabel }}'
      inputs:
        targetType: inline
        errorActionPreference: stop
        script: |
          $path = Join-Path "$(Build.SourcesDirectory)" "config/branches.json"
          if (-not (Test-Path $path)) { Write-Error "Config file not found: $path"; exit 1 }

          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $envLabel = "${{ parameters.envLabel }}"
          $envCfg = $cfg.$envLabel
          if ($null -eq $envCfg) {
            Write-Error "No entry for env '$envLabel' in config/branches.json. Add one and re-run."
            exit 1
          }

          # Scheduled runs honour schedule.enabled; manual runs ignore it, so
          # on-demand deploys still work while a schedule is paused.
          $isScheduled = "$(Build.Reason)" -eq 'Schedule'
          $sched = $envCfg.schedule
          $schedEnabled = $true
          if ($null -ne $sched -and $null -ne $sched.enabled) { $schedEnabled = [bool]$sched.enabled }

          if ($null -ne $sched) {
            $cronText = $sched.cron
            $noteText = $sched.note
            Write-Host ("Schedule       : enabled={0}  cron='{1}'  {2}" -f $schedEnabled, $cronText, $noteText)
          }

          if ($isScheduled -and -not $schedEnabled) {
            Write-Host "===================================================="
            Write-Host "Scheduled run for '$envLabel' is DISABLED in config/branches.json."
            Write-Host "Nothing will be built or deployed. Flip schedule.enabled to true to resume."
            Write-Host "===================================================="
            foreach ($comp in 'pc','bc','cc','cm') {
              Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]false"
            }
            exit 0
          }

          $defaultBranch = $envCfg.branch
          if ([string]::IsNullOrWhiteSpace($defaultBranch)) {
            Write-Error "Env '$envLabel' has no 'branch' value in config/branches.json."
            exit 1
          }

          $products = @($envCfg.products)
          if ($products.Count -eq 0) {
            Write-Error "Env '$envLabel' lists no 'products' in config/branches.json."
            exit 1
          }

          $overrides = $envCfg.overrides

          # Env-level switch: when on, every centre generates the dictionary.
          $genDD = $false
          if ($null -ne $envCfg.genDataDictionary) { $genDD = [bool]$envCfg.genDataDictionary }
          Write-Host "##vso[task.setvariable variable=genDataDictionary;isOutput=true]$($genDD.ToString().ToLower())"

          # Config names the secret holding the webhook, never the URL itself --
          # a webhook URL is a write credential for that channel.
          $notify = $envCfg.notify
          $notifyEnabled = $false
          $notifyVar = 'TEAMS_WEBHOOK'
          if ($null -ne $notify) {
            if ($null -ne $notify.enabled) { $notifyEnabled = [bool]$notify.enabled }
            if (-not [string]::IsNullOrWhiteSpace($notify.webhookVar)) { $notifyVar = $notify.webhookVar }
          }
          Write-Host "##vso[task.setvariable variable=notify_enabled;isOutput=true]$($notifyEnabled.ToString().ToLower())"
          Write-Host "##vso[task.setvariable variable=notify_webhookvar;isOutput=true]$notifyVar"

          $useConfig = "${{ parameters.useConfigProducts }}".ToLower() -eq 'true'
          $checkbox = @{
            pc = "${{ parameters.deployPC }}".ToLower() -eq 'true'
            bc = "${{ parameters.deployBC }}".ToLower() -eq 'true'
            cc = "${{ parameters.deployCC }}".ToLower() -eq 'true'
            cm = "${{ parameters.deployCM }}".ToLower() -eq 'true'
          }

          Write-Host "Env            : $envLabel"
          Write-Host "Default branch : $defaultBranch"
          Write-Host "In release     : $($products -join ', ')"
          Write-Host "Product source : $(if ($useConfig) { 'config file' } else { 'queue-time checkboxes' })"
          Write-Host "genDataDict.   : $genDD  (env-level: applies to every centre in this release)"
          Write-Host "Teams notify   : $notifyEnabled  (webhook from variable '$notifyVar')"
          Write-Host "----------------------------------------------------"

          # Change detection: skip a centre whose branch head is already
          # deployed here. The record is a build tag, so nothing lives outside ADO.
          $skipUnchanged = $false
          if ($null -ne $envCfg.skipIfUnchanged) { $skipUnchanged = [bool]$envCfg.skipIfUnchanged }
          $force = "${{ parameters.forceRebuild }}".ToLower() -eq 'true'
          if ($skipUnchanged -and $force) {
            Write-Host "Change detection: BYPASSED (forceRebuild ticked)"
          } elseif ($skipUnchanged) {
            Write-Host "Change detection: ON  (a centre is skipped if its branch head is already deployed here)"
          } else {
            Write-Host "Change detection: off (set skipIfUnchanged: true on this env to enable)"
          }

          $collection = "$(System.CollectionUri)"
          $project    = "$(System.TeamProject)"
          $hdr        = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }

          function Get-BranchSha {
            param([string]$Repo, [string]$Branch)
            $f = [uri]::EscapeDataString("heads/$Branch")
            $u = "$collection$project/_apis/git/repositories/$Repo/refs?filter=$f&api-version=6.0"
            try {
              $r = Invoke-RestMethod -Uri $u -Headers $hdr -Method Get
              if ($r.value.Count -gt 0) { return $r.value[0].objectId }
              Write-Host "  (branch '$Branch' not found in repo '$Repo')"
            } catch {
              Write-Host "  (could not resolve SHA for $Repo/$Branch -- $_)"
            }
            return $null
          }

          function Test-AlreadyDeployed {
            param([string]$Tag)
            $u = "$collection$project/_apis/build/builds?definitions=$(System.DefinitionId)&tagFilters=$Tag&resultFilter=succeeded&`$top=1&api-version=6.0"
            try {
              $r = Invoke-RestMethod -Uri $u -Headers $hdr -Method Get
              return ($r.count -gt 0)
            } catch {
              # Never block a deploy because the lookup failed.
              Write-Host "  (tag lookup failed, proceeding -- $_)"
              return $false
            }
          }

          $anyRun  = $false
          $skipped = @()
          foreach ($comp in 'pc','bc','cc','cm') {

            if ($products -notcontains $comp) {
              Write-Host ("{0,-3} : not in this release -- skipping" -f $comp.ToUpper())
              Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]false"
              continue
            }

            # Per-product exception, else the env's shared branch
            $branch = $defaultBranch
            $note = ''
            if ($null -ne $overrides -and -not [string]::IsNullOrWhiteSpace($overrides.$comp)) {
              $branch = $overrides.$comp
              $note = '  (override)'
            }

            $run = if ($useConfig) { $true } else { $checkbox[$comp] }

            # Resolve the branch head; skip if that commit is already live here.
            $sha = $null
            if ($run -and $skipUnchanged -and -not $force) {
              $sha = Get-BranchSha $comp.ToUpper() $branch
              if ($sha) {
                $short = $sha.Substring(0, 8)
                if (Test-AlreadyDeployed "$envLabel-$comp-$short") {
                  $run = $false
                  $note += "  [unchanged since last deployment: $short]"
                  $skipped += $comp.ToUpper()
                }
              }
            }
            Write-Host "##vso[task.setvariable variable=sha_$comp;isOutput=true]$sha"

            if ($run) { $anyRun = $true }

            Write-Host ("{0,-3} : {1} -> run={2}{3}" -f $comp.ToUpper(), $branch, $run, $note)
            Write-Host "##vso[task.setvariable variable=branch_$comp;isOutput=true]$branch"
            Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]$($run.ToString().ToLower())"
          }

          Write-Host "----------------------------------------------------"

          if (-not $anyRun -and $skipped.Count -gt 0) {
            $list = $skipped -join ', '
            Write-Host "##vso[task.logissue type=warning]No changes to deploy: $list already running the latest commit on $envLabel. Nothing was built or deployed."
            Write-Host ""
            Write-Host "  Every configured centre is already up to date."
            Write-Host "  Tick 'Force rebuild' at queue time to deploy the same commit again."
            Write-Host ""
            exit 0
          }

          if ($skipped.Count -gt 0) {
            Write-Host "##vso[task.logissue type=warning]Skipped (already deployed): $($skipped -join ', ')"
          }

          if (-not $anyRun) {
            Write-Error "Nothing to deploy for '$envLabel'. Either untick 'useConfigProducts' and tick a product, or check the config."
            exit 1
          }
