# =============================================================================
# ReadConfig stage -- single source of truth for "what deploys where, from which
# branch".
#
# Reads config/branches.json, looks up the given env label (e.g. DEV2, QA7), and
# publishes two output variables per product:
#   branch_<comp>  -> the release branch to build from
#   run_<comp>     -> 'true'/'false': whether to build+deploy this product
#
# Config shape (one branch per env; all centres normally share it):
#   "QA7": {
#     "branch":   "maintenance/rel-2026.08",   <- applies to every product listed
#     "products": ["pc", "bc", "cc"],          <- what is in this release
#     "overrides": { "bc": "feature/x" }       <- optional, rare exceptions
#   }
#
# Product selection rules:
#   * A product not in "products" NEVER runs for that env.
#   * useConfigProducts = true  -> run every product in "products" (scheduled runs)
#   * useConfigProducts = false -> run only the ticked checkboxes (manual runs)
#
# Why a runtime read? ADO resolves stages/resources/schedules at COMPILE time and
# cannot read a repo file then. But the branch is only APPLIED at runtime (git
# checkout in gw-build.yml), so resolving it in a runtime step works cleanly on
# ADO Server 2022 RTW. NOTE: cron schedules cannot come from this file -- they
# must be literal YAML in the wrapper pipeline.
# =============================================================================

parameters:
- name: envLabel                 # e.g. DEV2, QA7 -- key into branches.json
  type: string
- name: useConfigProducts        # true = deploy whatever the config lists
  type: boolean
- name: deployPC
  type: boolean
- name: deployBC
  type: boolean
- name: deployCC
  type: boolean
- name: deployCM
  type: boolean
- name: poolName
  type: string
  default: Default

stages:
- stage: ReadConfig
  displayName: 'Resolve branches + products from config'
  jobs:
  - job: Read
    displayName: 'Parse branches.json'
    pool:
      name: ${{ parameters.poolName }}
    steps:
    - checkout: self             # the repo holding config/branches.json
    - task: PowerShell@2
      name: cfg                  # step name -> output var prefix (cfg.branch_pc, cfg.run_pc)
      displayName: 'Resolve config for ${{ parameters.envLabel }}'
      inputs:
        targetType: inline
        errorActionPreference: stop
        script: |
          $path = Join-Path "$(Build.SourcesDirectory)" "config/branches.json"
          if (-not (Test-Path $path)) { Write-Error "Config file not found: $path"; exit 1 }

          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $envLabel = "${{ parameters.envLabel }}"
          $envCfg = $cfg.$envLabel
          if ($null -eq $envCfg) {
            Write-Error "No entry for env '$envLabel' in config/branches.json. Add one and re-run."
            exit 1
          }

          # --- Schedule gate -------------------------------------------------
          # A scheduled run honours "schedule.enabled". Manual runs ignore it,
          # so you can always deploy on demand even while the schedule is paused.
          # (The cron itself lives in the wrapper YAML -- ADO resolves schedules
          # at compile time and cannot read this file. The "cron" value here is
          # a human-readable record that must mirror the wrapper.)
          $isScheduled = "$(Build.Reason)" -eq 'Schedule'
          $sched = $envCfg.schedule
          $schedEnabled = $true
          if ($null -ne $sched -and $null -ne $sched.enabled) { $schedEnabled = [bool]$sched.enabled }

          if ($null -ne $sched) {
            $cronText = $sched.cron
            $noteText = $sched.note
            Write-Host ("Schedule       : enabled={0}  cron='{1}'  {2}" -f $schedEnabled, $cronText, $noteText)
          }

          if ($isScheduled -and -not $schedEnabled) {
            Write-Host "===================================================="
            Write-Host "Scheduled run for '$envLabel' is DISABLED in config/branches.json."
            Write-Host "Nothing will be built or deployed. Flip schedule.enabled to true to resume."
            Write-Host "===================================================="
            foreach ($comp in 'pc','bc','cc','cm') {
              Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]false"
            }
            exit 0
          }

          $defaultBranch = $envCfg.branch
          if ([string]::IsNullOrWhiteSpace($defaultBranch)) {
            Write-Error "Env '$envLabel' has no 'branch' value in config/branches.json."
            exit 1
          }

          $products = @($envCfg.products)
          if ($products.Count -eq 0) {
            Write-Error "Env '$envLabel' lists no 'products' in config/branches.json."
            exit 1
          }

          $overrides = $envCfg.overrides

          # gwb.bat genDataDictionary is disabled in classic for every env except
          # the one that needs the data dictionary. Opt in per env with
          # "genDataDictionary": true. Absent = false.
          $genDD = $false
          if ($null -ne $envCfg.genDataDictionary) { $genDD = [bool]$envCfg.genDataDictionary }
          Write-Host "##vso[task.setvariable variable=genDataDictionary;isOutput=true]$($genDD.ToString().ToLower())"

          $useConfig = "${{ parameters.useConfigProducts }}".ToLower() -eq 'true'
          $checkbox = @{
            pc = "${{ parameters.deployPC }}".ToLower() -eq 'true'
            bc = "${{ parameters.deployBC }}".ToLower() -eq 'true'
            cc = "${{ parameters.deployCC }}".ToLower() -eq 'true'
            cm = "${{ parameters.deployCM }}".ToLower() -eq 'true'
          }

          Write-Host "Env            : $envLabel"
          Write-Host "Default branch : $defaultBranch"
          Write-Host "In release     : $($products -join ', ')"
          Write-Host "Product source : $(if ($useConfig) { 'config file' } else { 'queue-time checkboxes' })"
          Write-Host "genDataDict.   : $genDD"
          Write-Host "----------------------------------------------------"

          $anyRun = $false
          foreach ($comp in 'pc','bc','cc','cm') {

            if ($products -notcontains $comp) {
              Write-Host ("{0,-3} : not in this release -- skipping" -f $comp.ToUpper())
              Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]false"
              continue
            }

            # Per-product exception, else the env's shared branch
            $branch = $defaultBranch
            $note = ''
            if ($null -ne $overrides -and -not [string]::IsNullOrWhiteSpace($overrides.$comp)) {
              $branch = $overrides.$comp
              $note = '  (override)'
            }

            $run = if ($useConfig) { $true } else { $checkbox[$comp] }
            if ($run) { $anyRun = $true }

            Write-Host ("{0,-3} : {1} -> run={2}{3}" -f $comp.ToUpper(), $branch, $run, $note)
            Write-Host "##vso[task.setvariable variable=branch_$comp;isOutput=true]$branch"
            Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]$($run.ToString().ToLower())"
          }

          Write-Host "----------------------------------------------------"
          if (-not $anyRun) {
            Write-Error "Nothing to deploy for '$envLabel'. Either untick 'useConfigProducts' and tick a product, or check the config."
            exit 1
          }
