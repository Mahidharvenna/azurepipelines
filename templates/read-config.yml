# =============================================================================
# ReadConfig stage -- single source of truth for "what deploys where, from which
# branch".
#
# Reads config/branches.json, looks up the given env label (e.g. DEV2, QA7), and
# publishes two output variables per product:
#   branch_<comp>  -> the release branch to build from
#   run_<comp>     -> 'true'/'false': whether to build+deploy this product
#
# Product selection rules:
#   * A product with no entry (or "NA") for this env NEVER runs.
#   * useConfigProducts = true  -> run every product the config lists (scheduled runs)
#   * useConfigProducts = false -> run only the ticked checkboxes (manual runs)
#
# Why a runtime read? ADO resolves stages/resources/schedules at COMPILE time and
# cannot read a repo file then. But the branch is only APPLIED at runtime (git
# checkout in gw-build.yml), so resolving it in a runtime step works cleanly on
# ADO Server 2022 RTW. NOTE: cron schedules cannot come from this file -- they
# must be literal YAML in the wrapper pipeline.
# =============================================================================

parameters:
- name: envLabel                 # e.g. DEV2, QA7 -- key into branches.json
  type: string
- name: useConfigProducts        # true = deploy whatever the config lists
  type: boolean
- name: deployPC
  type: boolean
- name: deployBC
  type: boolean
- name: deployCC
  type: boolean
- name: deployCM
  type: boolean
- name: poolName
  type: string
  default: Default

stages:
- stage: ReadConfig
  displayName: 'Resolve branches + products from config'
  jobs:
  - job: Read
    displayName: 'Parse branches.json'
    pool:
      name: ${{ parameters.poolName }}
    steps:
    - checkout: self             # the repo holding config/branches.json
    - task: PowerShell@2
      name: cfg                  # step name -> output var prefix (cfg.branch_pc, cfg.run_pc)
      displayName: 'Resolve config for ${{ parameters.envLabel }}'
      inputs:
        targetType: inline
        errorActionPreference: stop
        script: |
          $path = Join-Path "$(Build.SourcesDirectory)" "config/branches.json"
          if (-not (Test-Path $path)) { Write-Error "Config file not found: $path"; exit 1 }

          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $envLabel = "${{ parameters.envLabel }}"
          $envCfg = $cfg.$envLabel
          if ($null -eq $envCfg) {
            Write-Error "No entry for env '$envLabel' in config/branches.json. Add one and re-run."
            exit 1
          }

          $useConfig = "${{ parameters.useConfigProducts }}".ToLower() -eq 'true'
          $checkbox = @{
            pc = "${{ parameters.deployPC }}".ToLower() -eq 'true'
            bc = "${{ parameters.deployBC }}".ToLower() -eq 'true'
            cc = "${{ parameters.deployCC }}".ToLower() -eq 'true'
            cm = "${{ parameters.deployCM }}".ToLower() -eq 'true'
          }

          Write-Host "Env            : $envLabel"
          Write-Host "Product source : $(if ($useConfig) { 'config file' } else { 'queue-time checkboxes' })"
          Write-Host "----------------------------------------------------"

          $anyRun = $false
          foreach ($comp in 'pc','bc','cc','cm') {
            $branch = $envCfg.$comp

            # Treat missing / blank / "NA" as "not part of this release"
            if ([string]::IsNullOrWhiteSpace($branch) -or $branch -eq 'NA') {
              Write-Host ("{0,-3} : not configured for {1} -- skipping" -f $comp.ToUpper(), $envLabel)
              Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]false"
              continue
            }

            $run = if ($useConfig) { $true } else { $checkbox[$comp] }
            if ($run) { $anyRun = $true }

            Write-Host ("{0,-3} : branch '{1}' -> run={2}" -f $comp.ToUpper(), $branch, $run)
            Write-Host "##vso[task.setvariable variable=branch_$comp;isOutput=true]$branch"
            Write-Host "##vso[task.setvariable variable=run_$comp;isOutput=true]$($run.ToString().ToLower())"
          }

          Write-Host "----------------------------------------------------"
          if (-not $anyRun) {
            Write-Error "Nothing to deploy for '$envLabel'. Either the config lists no products for this env, or no product checkboxes were ticked."
            exit 1
          }
