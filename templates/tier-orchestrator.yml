# Shared body of every tier pipeline, extended from pipelines/release-*.yaml.
# ReadConfig -> Build -> Deploy -> Notify. Branch and product set come from
# config/branches.json, not from queue parameters.

parameters:
- name: envTier               # dev, qa, uat -- set by the entry pipeline
  type: string
- name: envInstance           # 1, 2, 7 ... -- passed through from queue parameter
  type: string
- name: useConfigProducts     # true = deploy whatever the config lists (scheduled runs)
  type: boolean
- name: deployPC
  type: boolean
- name: deployBC
  type: boolean
- name: deployCC
  type: boolean
- name: deployCM
  type: boolean
- name: notifyTeams          # false = Notify stage is present but skipped
  type: boolean
  default: false
- name: forceRebuild         # true = deploy even if the commit is already live
  type: boolean
  default: false
- name: dbSchema             # SQL schema owning the tracking tables (dbo, or your own)
  type: string
  default: 'dbo'
- name: poolName
  type: string
  default: Default

resources:
  repositories:
  # ref omitted deliberately: ADO Server 2022 RTW disallows template
  # expressions here. The branch is applied at checkout in gw-build.yml.
  - repository: pc
    type: git
    name: PC
  - repository: bc
    type: git
    name: BC
  - repository: cc
    type: git
    name: CC
  - repository: cm
    type: git
    name: CM

variables:
- group: 'deployment-secrets'
# NOT uniform -- CC and CM each have their own Tomcat. Verify against a classic
# deploy log ("Copy Latest war file to Server" prints the target path).
- name: catalinaBasePC
  value: '/opt/tomcat/apache-tomcat'
- name: catalinaBaseBC
  value: '/opt/tomcat/apache-tomcat'
- name: catalinaBaseCC
  value: '/opt/tomcat-cc/apache-tomcat'
- name: catalinaBaseCM
  value: '/opt/tomcat-cm/apache-tomcat'

stages:

# Fails fast if the env has no config entry or nothing would deploy.
- template: read-config.yml
  parameters:
    envLabel: '${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
    useConfigProducts: ${{ parameters.useConfigProducts }}
    deployPC: ${{ parameters.deployPC }}
    deployBC: ${{ parameters.deployBC }}
    deployCC: ${{ parameters.deployCC }}
    deployCM: ${{ parameters.deployCM }}
    forceRebuild: ${{ parameters.forceRebuild }}
    poolName: ${{ parameters.poolName }}

# All four jobs exist; each runs only if ReadConfig set run_<comp>=true, so a
# skipped centre shows as skipped rather than missing.
- stage: Build
  displayName: '🔨  Build'
  dependsOn: ReadConfig
  jobs:
  - template: gw-build.yml
    parameters:
      comp: pc
      repo: pc
      poolName: ${{ parameters.poolName }}
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_pc'] ]
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_pc'], 'true'))
      genDataDictionaryExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.genDataDictionary'] ]
      cleanSources: true          # classic PC build cleans sources; BC/CC/CM do not
  - template: gw-build.yml
    parameters:
      comp: bc
      repo: bc
      poolName: ${{ parameters.poolName }}
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_bc'] ]
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_bc'], 'true'))
      genDataDictionaryExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.genDataDictionary'] ]
  - template: gw-build.yml
    parameters:
      comp: cc
      repo: cc
      poolName: ${{ parameters.poolName }}
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_cc'] ]
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_cc'], 'true'))
      genDataDictionaryExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.genDataDictionary'] ]
  - template: gw-build.yml
    parameters:
      comp: cm
      repo: cm
      poolName: ${{ parameters.poolName }}
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_cm'] ]
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_cm'], 'true'))
      genDataDictionaryExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.genDataDictionary'] ]

# Depends on ReadConfig (branch + run vars) and Build (artifacts).
# envName MUST match the classic StageName format "<COMP> - <ENV>" (spaces around
# the hyphen). A mismatch inserts duplicate keys into a shared tracking table.
- stage: Deploy
  displayName: '🚀  Deploy to ${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
  dependsOn:
  - ReadConfig
  - Build
  jobs:
  - template: gw-deploy.yml
    parameters:
      comp: pc
      env: ${{ parameters.envTier }}
      envLabel: '${{ parameters.envTier }}${{ parameters.envInstance }}'
      envName: 'PC - ${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
      sshConnection: '${{ upper(parameters.envTier) }}${{ parameters.envInstance }}-PC'
      catalinaBase: $(catalinaBasePC)
      artifactName: 'pc-drop'
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_pc'] ]
      shaExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.sha_pc'] ]
      configComp: pc
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_pc'], 'true'))
      poolName: ${{ parameters.poolName }}
      dbSchema: ${{ parameters.dbSchema }}
  - template: gw-deploy.yml
    parameters:
      comp: bc
      env: ${{ parameters.envTier }}
      envLabel: '${{ parameters.envTier }}${{ parameters.envInstance }}'
      envName: 'BC - ${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
      sshConnection: '${{ upper(parameters.envTier) }}${{ parameters.envInstance }}-BC'
      catalinaBase: $(catalinaBaseBC)
      artifactName: 'bc-drop'
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_bc'] ]
      shaExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.sha_bc'] ]
      configComp: bc
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_bc'], 'true'))
      poolName: ${{ parameters.poolName }}
      dbSchema: ${{ parameters.dbSchema }}
  - template: gw-deploy.yml
    parameters:
      comp: cc
      env: ${{ parameters.envTier }}
      envLabel: '${{ parameters.envTier }}${{ parameters.envInstance }}'
      envName: 'CC - ${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
      sshConnection: '${{ upper(parameters.envTier) }}${{ parameters.envInstance }}-CC'
      catalinaBase: $(catalinaBaseCC)                            # CC has its own Tomcat
      artifactName: 'cc-drop'
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_cc'] ]
      shaExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.sha_cc'] ]
      configComp: cc
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_cc'], 'true'))
      poolName: ${{ parameters.poolName }}
      dbSchema: ${{ parameters.dbSchema }}
  # --- CM is special: COMP=ab (legacy), different CATALINA_BASE, artifact 'cm-drop' ---
  - template: gw-deploy.yml
    parameters:
      comp: ab                                                   # legacy CM mapping
      env: ${{ parameters.envTier }}
      envLabel: '${{ parameters.envTier }}${{ parameters.envInstance }}'
      envName: 'CM - ${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
      sshConnection: '${{ upper(parameters.envTier) }}${{ parameters.envInstance }}-CM'
      catalinaBase: $(catalinaBaseCM)                            # /opt/tomcat-cm/apache-tomcat
      artifactName: 'cm-drop'                                    # built from CM repo
      branchExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_cm'] ]
      shaExpr: $[ stageDependencies.ReadConfig.Read.outputs['cfg.sha_cm'] ]
      configComp: cm                                             # tag under 'cm', not 'ab'
      runCondition: and(succeeded(), eq(stageDependencies.ReadConfig.Read.outputs['cfg.run_cm'], 'true'))
      poolName: ${{ parameters.poolName }}
      dbSchema: ${{ parameters.dbSchema }}

# Present but skipped until notifyTeams is true and a webhook is set.
- template: notify-teams.yml
  parameters:
    envLabel: '${{ upper(parameters.envTier) }}${{ parameters.envInstance }}'
    notifyTeams: ${{ parameters.notifyTeams }}
    poolName: ${{ parameters.poolName }}
