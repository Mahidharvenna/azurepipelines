# =============================================================================
# Reusable build template for a Guidewire product (PC / BC / CC / CM).
#
# The release branch is NOT a parameter here -- it arrives as a runtime
# expression (branchExpr) resolved by the ReadConfig stage from
# config/branches.json, and is applied via a git checkout at run time.
# =============================================================================

parameters:
- name: comp
  type: string
  values: [pc, bc, cc, cm]
- name: repo
  type: string
  default: self
- name: poolName
  type: string
  default: Default
- name: branchExpr             # runtime expression -> the release branch (from ReadConfig)
  type: string
- name: runCondition           # runtime condition -> whether this product builds at all
  type: string
  default: succeeded()
- name: cleanSources           # mirrors each product's classic "Clean sources" setting
  type: boolean
  default: false
- name: genDataDictionaryExpr  # runtime expression -> 'true'/'false' (from ReadConfig)
  type: string
  default: 'false'

jobs:
- job: Build_${{ upper(parameters.comp) }}
  displayName: '${{ upper(parameters.comp) }} Build'
  condition: ${{ parameters.runCondition }}
  pool:
    name: ${{ parameters.poolName }}
  variables:
    # branchExpr is a runtime expression string ($[ stageDependencies... ]);
    # substituting it here makes releaseBranch resolve at run time.
    releaseBranch: ${{ parameters.branchExpr }}
    genDataDictionary: ${{ parameters.genDataDictionaryExpr }}
  # Classic parity: PC cleans sources; BC/CC/CM do not.
  ${{ if eq(parameters.cleanSources, true) }}:
    workspace:
      clean: all
  steps:

  # ADO Server 2022 RTW does not allow `ref:` on `checkout:`. We check out the
  # resource's default ref, then switch to the configured release branch.
  - checkout: ${{ parameters.repo }}
    clean: ${{ parameters.cleanSources }}
    persistCredentials: true       # keep agent git auth for the fetch/checkout below

  - script: |
      echo Building from configured release branch: $(releaseBranch)
      git fetch origin $(releaseBranch)
      git checkout $(releaseBranch)
      git log -1 --oneline
    workingDirectory: '$(Build.Repository.LocalPath)'
    displayName: 'Switch to configured release branch'

  - task: CopyFiles@2
    displayName: 'Copy GW core to: $(Build.Repository.LocalPath)'
    inputs:
      SourceFolder: 'C:\path\to\gw-core\${{ upper(parameters.comp) }}'
      Contents: '**'
      TargetFolder: '$(Build.Repository.LocalPath)'

  - task: CmdLine@2
    displayName: 'Run: gwb.bat clean'
    inputs:
      workingDirectory: '$(Build.Repository.LocalPath)'
      script: 'gwb.bat clean'

  # PC-only: remove example Jurisdiction file (tolerant if missing)
  - ${{ if eq(parameters.comp, 'pc') }}:
    - task: CmdLine@2
      displayName: 'Remove Jurisdiction.example.ttx'
      inputs:
        script: >
          if exist "$(Build.Repository.LocalPath)\modules\configuration\config\extensions\typelist\Jurisdiction.example.ttx"
          del "$(Build.Repository.LocalPath)\modules\configuration\config\extensions\typelist\Jurisdiction.example.ttx"

  - task: CmdLine@2
    displayName: 'Run: gwb.bat webResources'
    inputs:
      workingDirectory: '$(Build.Repository.LocalPath)'
      script: 'gwb.bat webResources'

  # Disabled in classic for every env EXCEPT the one that needs the data
  # dictionary. Driven by "genDataDictionary": true on that env in
  # config/branches.json -- the step is always defined but skips otherwise.
  # Position matches the classic PC build (after webResources, before the WAR).
  - task: CmdLine@2
    displayName: 'Run: gwb.bat genDataDictionary'
    condition: and(succeeded(), eq(variables['genDataDictionary'], 'true'))
    inputs:
      workingDirectory: '$(Build.Repository.LocalPath)'
      script: 'gwb.bat genDataDictionary'

  - task: CmdLine@2
    displayName: 'Run: gwb.bat warTomcatDBCP'
    inputs:
      workingDirectory: '$(Build.Repository.LocalPath)'
      script: 'gwb.bat warTomcatDBCP'

  - task: CopyFiles@2
    displayName: 'Copy WAR files to staging'
    condition: succeededOrFailed()
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)'
      Contents: '**/*.war'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  # Print the staged layout. CopyFiles preserves paths relative to SourceFolder,
  # so if a multi-repo checkout nests the sources the WAR lands one level deeper
  # inside the artifact. The deploy globs for it, but this makes the layout
  # visible in the log instead of something you discover at startup.
  - task: PowerShell@2
    displayName: 'Show staged artifact layout'
    condition: succeededOrFailed()
    inputs:
      targetType: inline
      script: |
        $stage = "$(Build.ArtifactStagingDirectory)"
        Write-Host "Sources dir : $(Build.SourcesDirectory)"
        Write-Host "Repo path   : $(Build.Repository.LocalPath)"
        Write-Host "Staging dir : $stage"
        $wars = Get-ChildItem -Path $stage -Filter '*.war' -Recurse -ErrorAction SilentlyContinue
        if (-not $wars) {
          Write-Host "##vso[task.logissue type=warning]No .war staged -- the build likely failed before producing one."
        } else {
          foreach ($w in $wars) {
            Write-Host ("  {0}  ({1:N0} bytes)" -f $w.FullName.Replace($stage,'').TrimStart('\','/'), $w.Length)
          }
        }

  # NOTE: PublishPipelineArtifact@1 is NOT supported on ADO Server (on-prem).
  # Using the older PublishBuildArtifacts@1 task instead -- same outcome.
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: ${{ parameters.comp }}-drop'
    condition: succeededOrFailed()
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: '${{ parameters.comp }}-drop'
      publishLocation: 'Container'
