# Posts a deployment summary to a Teams incoming webhook. Off by default: the
# stage is always present but skips unless notifyTeams is true, so it stays
# discoverable. Uses Invoke-RestMethod, so no marketplace extension is needed.
# See reports/README.md for setup.

parameters:
- name: envLabel                 # e.g. DEV1 -- shown in the message
  type: string
- name: notifyTeams              # false = stage present but skipped
  type: boolean
  default: false
- name: poolName
  type: string
  default: Default

stages:
- stage: Notify
  displayName: '📣  Notify'
  dependsOn:
  - ReadConfig
  - Build
  - Deploy
  # always() so a failed deploy still notifies; the boolean gates it off.
  condition: and(always(), ${{ parameters.notifyTeams }})
  jobs:
  - job: PostToTeams
    displayName: 'Post deployment summary'
    # Per-env switch, from config/branches.json -> notify.enabled.
    condition: eq(stageDependencies.ReadConfig.Read.outputs['cfg.notify_enabled'], 'true')
    pool:
      name: ${{ parameters.poolName }}
    variables:
      # At job level `dependencies` means jobs in THIS stage -- cross-stage
      # needs stageDependencies.
      buildResult:  $[ stageDependencies.Build.result ]
      deployResult: $[ stageDependencies.Deploy.result ]
      branchPc:     $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_pc'] ]
      branchBc:     $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_bc'] ]
      branchCc:     $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_cc'] ]
      branchCm:     $[ stageDependencies.ReadConfig.Read.outputs['cfg.branch_cm'] ]
      runPc:        $[ stageDependencies.ReadConfig.Read.outputs['cfg.run_pc'] ]
      runBc:        $[ stageDependencies.ReadConfig.Read.outputs['cfg.run_bc'] ]
      runCc:        $[ stageDependencies.ReadConfig.Read.outputs['cfg.run_cc'] ]
      runCm:        $[ stageDependencies.ReadConfig.Read.outputs['cfg.run_cm'] ]
      webhookVar:   $[ stageDependencies.ReadConfig.Read.outputs['cfg.notify_webhookvar'] ]
    steps:
    - checkout: none
    - task: PowerShell@2
      displayName: 'Post to Teams channel'
      # Secrets are not auto-mapped, so every webhook the config may name must
      # be declared here. Add a line per channel.
      env:
        TEAMS_WEBHOOK:     $(TEAMS_WEBHOOK)
        TEAMS_WEBHOOK_DEV: $(TEAMS_WEBHOOK_DEV)
        TEAMS_WEBHOOK_QA:  $(TEAMS_WEBHOOK_QA)
        TEAMS_WEBHOOK_UAT: $(TEAMS_WEBHOOK_UAT)
      inputs:
        targetType: inline
        errorActionPreference: stop
        script: |
          # Config names the secret; the URL itself never lives in config.
          $varName = "$(webhookVar)"
          if ([string]::IsNullOrWhiteSpace($varName)) { $varName = 'TEAMS_WEBHOOK' }
          $webhook = [Environment]::GetEnvironmentVariable($varName)

          if ([string]::IsNullOrWhiteSpace($webhook) -or $webhook -like '*$(*') {
            Write-Host "##vso[task.logissue type=warning]Variable '$varName' holds no webhook URL - skipping notification."
            Write-Host "Add it to the variable group as a SECRET, and map it in this task's env: block."
            exit 0
          }
          Write-Host "Using webhook from variable '$varName'"

          $envLabel = "${{ parameters.envLabel }}"
          $deploy   = "$(deployResult)"
          $build    = "$(buildResult)"

          # Deploy result dominates; build result is the fallback.
          if     ($deploy -eq 'Succeeded')           { $status = 'Succeeded' }
          elseif ($deploy -eq 'SucceededWithIssues') { $status = 'Succeeded with issues' }
          elseif ($build  -ne 'Succeeded')           { $status = 'Build failed' }
          else                                       { $status = 'Failed' }

          if ($status -eq 'Succeeded')                   { $colour = '2EB886' }
          elseif ($status -eq 'Succeeded with issues')   { $colour = 'DAA038' }
          else                                           { $colour = 'D93F3C' }

          # One line per centre that actually ran
          $centres = @()
          $all = @(
            @{ n = 'PolicyCenter';   run = "$(runPc)"; br = "$(branchPc)" },
            @{ n = 'BillingCenter';  run = "$(runBc)"; br = "$(branchBc)" },
            @{ n = 'ClaimCenter';    run = "$(runCc)"; br = "$(branchCc)" },
            @{ n = 'ContactManager'; run = "$(runCm)"; br = "$(branchCm)" }
          )
          foreach ($c in $all) {
            if ($c.run -eq 'true') { $centres += ($c.n + ' : ' + $c.br) }
          }
          if ($centres.Count -gt 0) {
            $centreText = $centres -join "`n`n"
          } else {
            $centreText = 'none'
          }

          $runUrl = "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

          # MessageCard: accepted by both classic connectors and Power Automate.
          $payload = @{
            '@type'    = 'MessageCard'
            '@context' = 'https://schema.org/extensions'
            summary    = "Guidewire deploy to $envLabel : $status"
            themeColor = $colour
            title      = "Guidewire deploy to $envLabel : $status"
            sections   = @(
              @{
                facts = @(
                  @{ name = 'Environment';  value = $envLabel }
                  @{ name = 'Run';          value = '$(Build.BuildNumber)' }
                  @{ name = 'Triggered by'; value = '$(Build.RequestedFor)' }
                  @{ name = 'Reason';       value = '$(Build.Reason)' }
                )
                text = "**Centres deployed**`n`n$centreText"
              }
            )
            potentialAction = @(
              @{
                '@type' = 'OpenUri'
                name    = 'View pipeline run'
                targets = @(@{ os = 'default'; uri = $runUrl })
              }
            )
          } | ConvertTo-Json -Depth 10

          Write-Host "Posting summary for $envLabel ($status)"
          Invoke-RestMethod -Uri $webhook -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Notification sent."
