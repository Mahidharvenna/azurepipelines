# Per-product deploy: 16 steps, translated from the classic GW_TEM_Deployment
# task group. The release branch arrives as a runtime expression from ReadConfig.

parameters:
- name: comp                    # pc, bc, cc, ab  (CM uses 'ab' for legacy reasons)
  type: string
- name: env                     # dev, qa, etc. (tier only, used in log paths)
  type: string
- name: envLabel                # full env label (e.g. dev1, qa2) -- maps to ADO Environment
  type: string
- name: envName                 # stage label for tracking rows: PC-DEV1, BC-DEV1, ...
  type: string
- name: sshConnection           # ADO SSH service-connection name (e.g. DEV1-PC)
  type: string
- name: catalinaBase
  type: string
  default: '/opt/tomcat/apache-tomcat'
- name: branchExpr              # runtime expression -> the release branch (from ReadConfig)
  type: string
- name: artifactName            # pipeline artifact to download (e.g. pc-drop, cm-drop)
  type: string
- name: poolName
  type: string
  default: Default
- name: runCondition            # runtime condition -> whether this product deploys at all
  type: string
  default: succeeded()
- name: dbSchema                # SQL schema owning the tracking tables
  type: string
  default: 'dbo'
# YAML has no Release.* variables, so these come from Build.* and run longer
# than the columns expect. Cap rather than let SQL reject the whole statement.
- name: maxReleaseName
  type: number
  default: 50
- name: maxBuildName
  type: number
  default: 50
- name: maxSourceBranch
  type: number
  default: 50
- name: maxCommitInfo
  type: number
  default: 500
- name: maxCommitAuthor
  type: number
  default: 50
- name: configComp              # comp as named in config (CM deploys as 'ab')
  type: string
  default: ''
- name: shaExpr                 # runtime expression -> branch head SHA (from ReadConfig)
  type: string
  default: ''

jobs:
- deployment: Deploy_${{ upper(parameters.comp) }}
  displayName: 'Deploy ${{ upper(parameters.comp) }} to ${{ upper(parameters.envLabel) }}'
  condition: ${{ parameters.runCondition }}
  environment: '${{ parameters.envLabel }}'   # ADO Environment named e.g. dev1, dev2, qa1
  pool:
    name: ${{ parameters.poolName }}
  variables:
    releaseBranch: ${{ parameters.branchExpr }}   # resolves at runtime from ReadConfig
    deployedSha:   ${{ parameters.shaExpr }}      # branch head that this run deploys
  strategy:
    runOnce:
      deploy:
        steps:

        # @1 is unavailable on ADO Server 2022 RTW.
        - task: DownloadBuildArtifacts@0
          displayName: 'Prep 1/2  Download ${{ parameters.artifactName }}'
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: '${{ parameters.artifactName }}'
            downloadPath: '$(Pipeline.Workspace)'

        # Fail before anything on the server is touched.
        - task: PowerShell@2
          displayName: 'Prep 2/2  Verify WAR present in artifact'
          inputs:
            targetType: inline
            errorActionPreference: stop
            script: |
              $root = "$(Pipeline.Workspace)/${{ parameters.artifactName }}"
              Write-Host "Artifact root: $root"
              $wars = Get-ChildItem -Path $root -Filter '*.war' -Recurse -ErrorAction SilentlyContinue
              if (-not $wars) {
                Write-Error "No .war found under $root. The build published an unexpected layout -- check the build's 'Copy WAR files to staging' step."
                exit 1
              }
              foreach ($w in $wars) {
                Write-Host ("  {0}  ({1:N0} bytes)" -f $w.FullName.Replace($root,'').TrimStart('\','/'), $w.Length)
              }

        # --- 1. Pre-deployment: insert "Started" row in the tracking DB ---
        - task: PowerShell@2
          displayName: ' 1/16  Pre-deployment DB record'
          inputs:
            targetType: inline
            errorActionPreference: stop
            failOnStderr: false
            script: |
              # Classic stores the trailing segment only (a/b/c -> c). Match it,
              # or the previous-branch comparison never hits.
              $branchShort = ("$(releaseBranch)" -split '/')[-1]

              $connectionString = "Server=$(DBINSTANCE);Database=$(DBNAME);user=$(DBUSER);password=$(DBPASS)"
              $releaseNotesLogTableName = "${{ parameters.dbSchema }}.ReleaseNotesLog"
              $currentBuildTableName    = "${{ parameters.dbSchema }}.CurrentBuild"

              function ExecuteSqlQuery {
                param ([string]$ConnectionString, [string]$Query, [bool]$ReturnData = $false)
                Add-Type -AssemblyName "System.Data"
                $connection = New-Object System.Data.SqlClient.SqlConnection $ConnectionString
                $command = $connection.CreateCommand()
                $command.CommandText = $Query
                try {
                  $connection.Open()
                  if ($ReturnData) { return $command.ExecuteScalar() }
                  else { $command.ExecuteNonQuery() | Out-Null }
                } catch {
                  Write-Host "SQL error: $_"
                  Write-Host "--- failing statement ---"
                  Write-Host $Query
                  Write-Host "-------------------------"
                  exit 1
                } finally { $connection.Close() }
              }

              # Build.* values are wider than the columns expect.
              function Trunc {
                param([string]$Value, [int]$Max, [string]$Label)
                if ($null -eq $Value) { return '' }
                if ($Value.Length -gt $Max) {
                  Write-Host "##vso[task.logissue type=warning]$Label truncated from $($Value.Length) to $Max chars."
                  return $Value.Substring(0, $Max)
                }
                return $Value
              }

              $relName   = Trunc '$(Build.BuildNumber)'   ${{ parameters.maxReleaseName }}  'ReleaseName'
              $buildName = Trunc '$(Build.DefinitionName)' ${{ parameters.maxBuildName }}    'BuildName'
              $branchVal = Trunc $branchShort              ${{ parameters.maxSourceBranch }} 'SourceBranch'

              $previousBuildID = ExecuteSqlQuery -ConnectionString $connectionString `
                -Query "SELECT CurrentBuildID from $currentBuildTableName where StageName = '${{ parameters.envName }}'" `
                -ReturnData $true

              if ($null -eq $previousBuildID) {
                ExecuteSqlQuery -ConnectionString $connectionString -Query @"
              INSERT INTO $currentBuildTableName (StageName, CurrentBuildID, SourceBranch)
              VALUES ('${{ parameters.envName }}', '$(Build.BuildId)', '$branchShort')
              "@
              }

              ExecuteSqlQuery -ConnectionString $connectionString -Query @"
              INSERT INTO $releaseNotesLogTableName (BuildName, SourceBranch, PreviousBuildID, ReleaseName, RunName, StageName, Attempt, Status)
              VALUES ('$buildName', '$branchVal', '$previousBuildID', '$relName', '$relName', '${{ parameters.envName }}', '$(System.JobAttempt)', 'Started')
              "@

        # --- 2. Shutdown Guidewire ---
        - task: SSH@0
          displayName: ' 2/16  Shutdown Guidewire'
          continueOnError: true
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: 'sh ${{ parameters.catalinaBase }}/bin/forceShutDown.sh'
            failOnStdErr: false
            readyTimeout: '20000'

        # --- 3. Trim catalina.out ---
        - task: SSH@0
          displayName: ' 3/16  Trim catalina.out'
          continueOnError: true
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              source ~/.gwr_profile
              LOG_FILE=$CATALINA_OUT
              LINES_TO_KEEP=2000
              if [[ -f "$LOG_FILE" ]]; then
                tail -n "$LINES_TO_KEEP" "$LOG_FILE" > "${LOG_FILE}.tmp" && mv "${LOG_FILE}.tmp" "$LOG_FILE"
                echo "--- Trimming complete ---"
              else
                echo "-> File '$LOG_FILE' not found. Skipping."
              fi
            readyTimeout: '20000'

        # --- 4. Delete log files older than 60 days (skip for ab) ---
        - task: SSH@0
          displayName: ' 4/16  Delete logs older than 60 days'
          continueOnError: true
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              if [[ "ab" = "${{ parameters.comp }}" ]]; then
                echo "Log files are not deleted for ab"
              else
                find /var/app/logs/${{ parameters.env }}/${{ parameters.comp }}/gw -name "*.log.*" -mtime +60 -type f -exec rm -rf {} \;
              fi
            readyTimeout: '20000'

        # --- 5. Delete war files older than 5 days ---
        - task: SSH@0
          displayName: ' 5/16  Delete WARs older than 5 days'
          continueOnError: true
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              find ${{ parameters.catalinaBase }}/webapps -name "${{ parameters.comp }}.war?*" -mtime +5 -exec ls -lrt {} \;
              find ${{ parameters.catalinaBase }}/webapps -name "${{ parameters.comp }}.war?*" -mtime +5 -exec rm -vf {} \;
            readyTimeout: '20000'

        # --- 6. Backup existing WAR ---
        - task: SSH@0
          displayName: ' 6/16  Back up existing WAR'
          continueOnError: true
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              if [ -f ${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}.war ]; then
                mv ${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}.war \
                   ${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}.war_`date +"%Y%m%d@%H%M"`
              fi
            readyTimeout: '20000'

        # --- 7. Copy new WAR to server ---
        # Glob from the artifact root, not a fixed path: a multi-repo checkout
        # can nest sources a level deeper.
        # failOnEmptySource MUST stay true -- with it false a path mismatch copies
        # nothing, goes green, and the steps below then delete the webapp and
        # unzip a WAR that never arrived. Surfaces as OSGi errors at startup.
        - task: CopyFilesOverSSH@0
          displayName: ' 7/16  Copy WAR to server'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            sourceFolder: '$(Pipeline.Workspace)/${{ parameters.artifactName }}'
            contents: '**/dist/wars/TomcatDbcp/${{ parameters.comp }}.war'
            targetFolder: '${{ parameters.catalinaBase }}/webapps'
            isWindowsOnTarget: false
            overwrite: true
            cleanTargetFolder: false
            cleanHiddenFilesInTarget: false
            failOnEmptySource: true
            flattenFolders: true
            readyTimeout: '20000'

        # --- 8. Remove old extracted webapp dir ---
        - task: SSH@0
          displayName: ' 8/16  Remove old webapp directory'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: commands
            commands: 'rm -rf ${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}'
            readyTimeout: '20000'

        # --- 9. Unzip new WAR ---
        - task: SSH@0
          displayName: ' 9/16  Extract new WAR'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: commands
            commands: 'unzip ${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}.war -d ${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}'
            readyTimeout: '20000'

        # --- 10. Replace GWR user password in config files ---
        - task: SSH@0
          displayName: '10/16  Patch runtime DB password'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            failOnStdErr: true
            inline: |
              case "${{ parameters.comp }}" in
                pc)
                  gwruser_dbpass="$(pc_userpass)"
                  ;;
                bc)
                  gwruser_dbpass="$(bc_userpass)"
                  ;;
                cc)
                  gwruser_dbpass="$(cc_userpass)"
                  ;;
                ab)
                  gwruser_dbpass="$(ab_userpass)"
                  ;;
              esac

              BASE_DIR="${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}/modules/configuration"

              # [^;"]* is load-bearing: the password sits inside a JDBC URL
              # attribute, so the match must stop at the ';' or '"'. A broader
              # class runs past the closing quote and corrupts the XML, which
              # surfaces later as 'jdbc-url must not contain <' at startup.
              sed -i 's/Password=[^;"]*/Password='"$gwruser_dbpass"'/' "$BASE_DIR/config/database-config.xml"

              # Per centre -- s/guidewire/<pass>/g is a blunt global replace.
              case "${{ parameters.comp }}" in
                pc)
                  if [ -f "$BASE_DIR/gsrc/ext/DBintegration/config/DBintegration.properties" ]; then
                    sed -i 's/guidewire/'"$gwruser_dbpass"'/g' "$BASE_DIR/gsrc/ext/DBintegration/config/DBintegration.properties"
                  fi

                  if [ -f "$BASE_DIR/gsrc/pmt/pc/configuration/config/pmt.properties" ]; then
                    sed -i 's/guidewire/'"$gwruser_dbpass"'/g' "$BASE_DIR/gsrc/pmt/pc/configuration/config/pmt.properties"
                  fi
                  ;;
                cc)
                  if [ -f "$BASE_DIR/config/integrationext/integration_ext.properties" ]; then
                    sed -i 's/guidewire/'"$gwruser_dbpass"'/g' "$BASE_DIR/config/integrationext/integration_ext.properties"
                  fi
                  ;;
                bc)
                  if [ -f "$BASE_DIR/gsrc/ext/DBintegration/config/DBintegration.properties" ]; then
                    sed -i 's/guidewire/'"$gwruser_dbpass"'/g' "$BASE_DIR/gsrc/ext/DBintegration/config/DBintegration.properties"
                  fi
                  ;;
              esac
            readyTimeout: '20000'

        # --- 11. Remove prod mail domains from ScriptParameters.xml ---
        # SAFETY: strips prod mail domains entirely (someone@prod -> someone,
        # unsendable) so a non-prod env cannot email real recipients. List EVERY
        # prod domain -- a missed one means live mail from DEV/QA.
        - task: SSH@0
          displayName: '11/16  Strip prod mail domains'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              SP=${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}/modules/configuration/config/resources/ScriptParameters.xml
              sed -i -e 's/@example.com//g' -e 's/@example.net//g' "$SP"
              cat "$SP"
            readyTimeout: '20000'

        # --- 12. Update log dir in log4j2.xml ---
        - task: SSH@0
          displayName: '12/16  Point logs at ${{ parameters.env }}'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              LOG4J=${{ parameters.catalinaBase }}/webapps/${{ parameters.comp }}/modules/configuration/config/logging/log4j2.xml
              # Line-addressed: only rewrites the guidewire.logDirectory line.
              sed -i '/<Property name="guidewire.logDirectory">/s/env/${{ parameters.env }}/g' $LOG4J
              cat $LOG4J | grep -e '<Property name="guidewire.logDirectory"' || true
            readyTimeout: '20000'

        # --- 13. Start Guidewire ---
        - task: SSH@0
          displayName: '13/16  Start Guidewire'
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: 'sh ${{ parameters.catalinaBase }}/bin/validateStartUp.sh'
            failOnStdErr: false
            readyTimeout: '20000'

        # --- 14. Dump last 500 log lines on failure ---
        - task: SSH@0
          displayName: '14/16  Dump app log (on failure)'
          condition: failed()
          inputs:
            sshEndpoint: ${{ parameters.sshConnection }}
            runOptions: inline
            interpreterCommand: '/bin/bash'
            inline: |
              source ~/.gwr_profile
              tail -500 $CATALINA_OUT
            readyTimeout: '20000'

        # --- 15. Post-deployment: write commits + final status to the tracking DB ---
        - task: PowerShell@2
          displayName: '15/16  Post-deployment DB record'
          condition: always()
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          inputs:
            targetType: inline
            errorActionPreference: stop
            failOnStderr: false
            script: |
              # Classic writes $(Build.SourceBranchName) -- the TRAILING SEGMENT only
              # (maintenance/rel-2026.06 -> rel-2026.06). Existing rows use that
              # form, so match it or the previous-branch comparison never hits and
              # every run reports "SourceBranch Changed".
              $branchShort = ("$(releaseBranch)" -split '/')[-1]

              $connectionString = "Server=$(DBINSTANCE);Database=$(DBNAME);user=$(DBUSER);password=$(DBPASS)"
              $releaseNotesTableName    = "${{ parameters.dbSchema }}.ReleaseNotes"
              $releaseNotesLogTableName = "${{ parameters.dbSchema }}.ReleaseNotesLog"
              $currentBuildTableName    = "${{ parameters.dbSchema }}.CurrentBuild"
              $projectName              = "MyOrg"

              function ExecuteSqlQuery {
                param ([string]$ConnectionString, [string]$Query, [bool]$ReturnData = $false)
                Add-Type -AssemblyName "System.Data"
                $connection = New-Object System.Data.SqlClient.SqlConnection $ConnectionString
                $command = $connection.CreateCommand()
                $command.CommandText = $Query
                try {
                  $connection.Open()
                  if ($ReturnData) { return $command.ExecuteScalar() }
                  else { $command.ExecuteNonQuery() | Out-Null }
                } catch {
                  Write-Host "SQL error: $_"
                  # 'String or binary data would be truncated' means a value is
                  # wider than its column. Echo the statement so the offending
                  # value is visible instead of having to guess.
                  Write-Host "--- failing statement ---"
                  Write-Host $Query
                  Write-Host "-------------------------"
                  exit 1
                } finally { $connection.Close() }
              }

              # Widths come from parameters -- check yours with:
              #   SELECT COLUMN_NAME, CHARACTER_MAXIMUM_LENGTH
              #   FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME='ReleaseNotes';
              $MAX_RELEASENAME = ${{ parameters.maxReleaseName }}
              $MAX_BUILDNAME   = ${{ parameters.maxBuildName }}
              $MAX_BRANCH      = ${{ parameters.maxSourceBranch }}
              $MAX_COMMITINFO  = ${{ parameters.maxCommitInfo }}
              $MAX_AUTHOR      = ${{ parameters.maxCommitAuthor }}

              function Trunc {
                param([string]$Value, [int]$Max, [string]$Label)
                if ($null -eq $Value) { return '' }
                if ($Value.Length -gt $Max) {
                  Write-Host "##vso[task.logissue type=warning]$Label truncated from $($Value.Length) to $Max chars."
                  return $Value.Substring(0, $Max)
                }
                return $Value
              }

              function GETCHANGES {
                param ([Parameter(Mandatory=$true)][string]$FROMBUILD)
                if ($FROMBUILD -eq '$(Build.BuildId)') { return @{count = -1} }
                if ([int]$FROMBUILD -gt [int]'$(Build.BuildId)') { return @{count = 0} }
                $url = "https://your-ado-host.example.com/your-collection/$projectName/_apis/build/changes?fromBuildId=$FROMBUILD&toBuildId=$(Build.BuildId)"
                $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
                $resp = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing
                return ($resp.Content | ConvertFrom-Json)
              }

              $relName   = Trunc '$(Build.BuildNumber)'   $MAX_RELEASENAME 'ReleaseName'
              $buildName = Trunc '$(Build.DefinitionName)' $MAX_BUILDNAME   'BuildName'
              $branchVal = Trunc $branchShort              $MAX_BRANCH      'SourceBranch'

              $previousBranch = ExecuteSqlQuery -ConnectionString $connectionString `
                -Query "SELECT SourceBranch from $currentBuildTableName where StageName = '${{ parameters.envName }}'" `
                -ReturnData $true

              if ($previousBranch -eq '$branchShort') {
                $FROMBUILD = ExecuteSqlQuery -ConnectionString $connectionString `
                  -Query "SELECT CurrentBuildID from $currentBuildTableName where StageName = '${{ parameters.envName }}'" `
                  -ReturnData $true
                Write-Output "FROMBUILD = $FROMBUILD"
                $PARSED = GETCHANGES -FROMBUILD $FROMBUILD
                Write-Output "Number of changes = $($PARSED.count)"
                if ($PARSED.count -gt 0) {
                  foreach ($v in $PARSED.value) {
                    $msg       = $v.message.Replace("'","''")
                    $msgVal    = Trunc $msg                       $MAX_COMMITINFO 'CommitInfo'
                    $authorVal = Trunc $v.author.displayName      $MAX_AUTHOR     'CommitAuthor'
                    ExecuteSqlQuery -ConnectionString $connectionString -Query @"
              INSERT INTO $releaseNotesTableName (ReleaseName, StageName, BuildName, SourceBranch, CommitInfo, CommitAuthor, CommitTimestamp)
              VALUES ('$relName', '${{ parameters.envName }}', '$buildName', '$branchVal', '$msgVal', '$authorVal', '$($v.timestamp)')
              "@
                  }
                  $finalStatus = 'Completed'
                } elseif ($PARSED.count -lt 0) {
                  $finalStatus = 'Downgrade'
                } else {
                  $finalStatus = 'No Changes'
                }
              } else {
                ExecuteSqlQuery -ConnectionString $connectionString -Query @"
              INSERT INTO $releaseNotesTableName (ReleaseName, StageName, BuildName, SourceBranch, CommitInfo, CommitAuthor, CommitTimestamp)
              VALUES ('$relName', '${{ parameters.envName }}', '$buildName', '$branchVal', 'SourceBranch Changed', 'NA', 'NA')
              "@
                $finalStatus = 'SourceBranch Changed'
              }

              ExecuteSqlQuery -ConnectionString $connectionString -Query @"
              UPDATE $releaseNotesLogTableName SET Status = '$finalStatus'
              WHERE ReleaseName = '${{ parameters.envName }}'
                AND RunName     = '$relName'
                AND Attempt     = '$(System.JobAttempt)'
              "@

              ExecuteSqlQuery -ConnectionString $connectionString -Query @"
              UPDATE $currentBuildTableName
              SET SourceBranch   = '$branchVal',
                  CurrentBuildID = '$(Build.BuildId)'
              WHERE StageName    = '${{ parameters.envName }}'
              "@

        # --- 16. Record the deployed commit -----------------------------------
        # Tags the build <ENV>-<comp>-<sha8>; ReadConfig looks for it to decide
        # whether anything changed. Best-effort -- must not fail a good deploy.
        - task: PowerShell@2
          displayName: '16/16  Record deployed commit'
          condition: succeeded()
          continueOnError: true
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          inputs:
            targetType: inline
            script: |
              $sha = "$(deployedSha)"
              if ([string]::IsNullOrWhiteSpace($sha) -or $sha.Length -lt 8) {
                Write-Host "No commit SHA resolved for this run -- nothing to tag."
                Write-Host "(Change detection is only active when skipIfUnchanged is set on the env.)"
                exit 0
              }
              $comp = '${{ parameters.configComp }}'
              if ([string]::IsNullOrWhiteSpace($comp)) { $comp = '${{ parameters.comp }}' }
              $tag = "${{ upper(parameters.envLabel) }}-$comp-" + $sha.Substring(0, 8)
              $url = "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/tags/$tag?api-version=6.0"
              try {
                Invoke-RestMethod -Uri $url -Method Put -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } | Out-Null
                Write-Host "Tagged this build '$tag' -- a later run on the same commit will skip."
              } catch {
                Write-Host "##vso[task.logissue type=warning]Could not tag the build ($_). Change detection will re-deploy this commit next time."
              }
