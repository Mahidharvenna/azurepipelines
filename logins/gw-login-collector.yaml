# Daily login collector: Loki -> SQL Server.
# Python; standard library plus pyodbc (the only pip dependency).
#
# Grafana reads SQL Server, so the dashboard is not capped by Loki's ~30-day
# retention. Companion to reports/monthly_report.py -- same Loki selector, same
# LOGIN_USER_REGEX, same REPORT_TIMEZONE, so the numbers reconcile.

# No schedules: block here on purpose. Manage the schedule in the UI
# (Edit -> ... -> Triggers -> Scheduled -> + Add) as the single source of truth:
# when both exist, ADO runs only the UI schedules and ignores the YAML ones.
# UNTICK 'Only schedule builds if the source or pipeline has changed' -- this
# job's source never changes, so a ticked box means it runs once, then never.
#
# !! Schedule this DAILY. If it stops running for more than ~30 days the missed
# !! days age out of Loki and are unrecoverable. Keep the staleness alert wired.
trigger: none
pr: none

name: 'GW-LoginCollector-$(Date:yyyyMMdd).$(Rev:r)'

parameters:
# Seed history at go-live, or repair a gap. Blank = normal daily mode.
- name: backfillStart
  displayName: 'Backfill start (YYYY-MM-DD). Blank for a normal daily run.'
  type: string
  default: ''
- name: backfillEnd
  displayName: 'Backfill end (YYYY-MM-DD). Blank means yesterday.'
  type: string
  default: ''
- name: dryRun
  displayName: 'Dry run -- query Loki, write nothing to the database'
  type: boolean
  default: false

# ADO Server 2022 RTW rejects a template expression on pool.name, so this is a
# literal. Demands are fine under a literal name.
#
# Pinned to Linux: the steps below are bash, and the ODBC driver is installed
# per machine, so the setup 'check' and the daily collector must land on the
# same kind of agent. If 'Default' holds more than one Linux agent, either give
# every one of them the prerequisites (DEPLOY.md) or pin the one that has them:
#   - Agent.Name -equals <agent-name>
pool:
  name: Default
  demands:
  - Agent.OS -equals Linux

variables:
# Database credentials. Point this at your existing DB variable group rather
# than copying the password into a second place; the env block below maps the
# names. Needs DBINSTANCE, DBNAME, DBUSER, DBPASS.
- group: 'gw-logins-db'
# Shared with reports/gw-monthly-login-report.yaml ON PURPOSE. LOKI_PROJECT,
# LOGIN_USER_REGEX, REPORT_TIMEZONE, ENVS and PRODUCT_JOBS must be identical in
# both jobs or the dashboard silently stops reconciling with the spreadsheet --
# one group makes drift impossible. Collector-only settings (LOOKBACK_DAYS,
# DB_TRUST_SERVER_CERT, ...) all have working defaults; add them here only to
# override. The group also holds SMTP secrets; they are never mapped into this
# job's env, and ADO does not expose an unmapped secret to a script.
- group: 'gw-reports-secrets'

steps:
- checkout: self
  clean: true

# UsePythonVersion@0 only searches the agent tool cache, so it fails on
# self-hosted agents even with Python installed. prepare_python.sh picks the
# newest python3 >= 3.9 on PATH, builds a job-local venv (avoids PEP 668 and
# old system pip), installs pyodbc into it, prints what the agent has, and sets
# $(PYTHON_EXE). It is a file rather than inline so ADO cannot macro-expand the
# $(...) inside it.
- script: bash logins/tools/prepare_python.sh "$(Agent.TempDirectory)"
  displayName: 'Prepare Python'
  env:
    # Only needed when the agent can't reach PyPI (DEPLOY.md 0.4). Mapped
    # explicitly so a feed URL holding a credential can be a secret variable --
    # ADO never exposes a secret to a script unless it is mapped. Undefined ones
    # arrive as the literal $(NAME), which the script discards.
    PIP_INDEX_URL:       $(PIP_INDEX_URL)
    PIP_EXTRA_INDEX_URL: $(PIP_EXTRA_INDEX_URL)
    HTTPS_PROXY:         $(HTTPS_PROXY)

- script: '"$(PYTHON_EXE)" logins/collect_logins.py'
  displayName: 'Collect logins into SQL Server'
  workingDirectory: '$(Build.SourcesDirectory)'
  env:
    # --- Loki ---
    LOKI_URL:            $(LOKI_URL)
    LOKI_PROJECT:        $(LOKI_PROJECT)
    LOKI_VERIFY_TLS:     $(LOKI_VERIFY_TLS)
    LOKI_CA_BUNDLE:      $(LOKI_CA_BUNDLE)      # optional: internal CA .pem for Loki
    BYPASS_PROXY:        $(BYPASS_PROXY)
    LOKI_LOG_LIMIT:      $(LOKI_LOG_LIMIT)
    LOKI_RETENTION_DAYS: $(LOKI_RETENTION_DAYS)
    # --- database (names mapped from the DB variable group) ---
    DB_SERVER:             $(DBINSTANCE)
    DB_NAME:               $(DBNAME)
    DB_USER:               $(DBUSER)
    DB_PASS:               $(DBPASS)
    DB_SCHEMA:             $(DB_SCHEMA)
    DB_ODBC_DRIVER:        $(DB_ODBC_DRIVER)
    DB_TRUSTED_CONNECTION: $(DB_TRUSTED_CONNECTION)
    DB_ENCRYPT:            $(DB_ENCRYPT)
    DB_TRUST_SERVER_CERT:  $(DB_TRUST_SERVER_CERT)
    # --- scope (mirror the report's variable group) ---
    ENVS:             $(ENVS)
    ENVS_EXCLUDE:     $(ENVS_EXCLUDE)
    PRODUCTS:         $(PRODUCTS)
    PRODUCT_JOBS:     $(PRODUCT_JOBS)
    PRODUCT_FRAGS:    $(PRODUCT_FRAGS)
    LOGIN_USER_REGEX: $(LOGIN_USER_REGEX)
    REPORT_TIMEZONE:  $(REPORT_TIMEZONE)
    REPORT_TZ_LABEL:  $(REPORT_TZ_LABEL)
    STORE_USERNAMES:  $(STORE_USERNAMES)
    LOOKBACK_DAYS:    $(LOOKBACK_DAYS)
    # --- run mode ---
    BACKFILL_START: ${{ parameters.backfillStart }}
    BACKFILL_END:   ${{ parameters.backfillEnd }}
    DRY_RUN:        ${{ parameters.dryRun }}
    BUILD_ID:       $(Build.BuildNumber)
