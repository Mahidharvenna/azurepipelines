# =============================================================================
# TEMPORARY bootstrap pipeline for the login-history database.
#
# Does the one-off setup that would otherwise need sqlcmd on someone's laptop:
# pre-flight checks, schema, grants, verification. Delete it once the dashboard
# is live -- the daily collector (gw-login-collector.yaml) is the thing that
# stays.
#
# Python + pymssql, same as the collector. A successful 'check' therefore also
# proves the collector can reach and write to SQL Server from this agent.
#
# Register: Pipelines -> New -> Existing YAML -> /logins/gw-login-setup.yaml
#
# Run it in this order:
#   1. check    -- touches nothing, tells you what is wrong
#   2. schema   -- creates the tables
#   3. grants   -- needs grafanaLogin
#   4. verify   -- after the collector's first backfill
# =============================================================================

trigger: none
pr: none

name: 'GW-LoginSetup-$(Date:yyyyMMdd).$(Rev:r)'

parameters:
# Defaults to the read-only action on purpose: an accidental run changes nothing.
- name: action
  displayName: 'What to do'
  type: string
  default: check
  values:
    - check      # pre-flight only -- no writes
    - schema     # create tables and views (idempotent)
    - grants     # apply permissions -- needs grafanaLogin below
    - verify     # run the checks and print every result set
    - all        # check, schema, grants, verify

- name: grafanaLogin
  displayName: 'Grafana read-only SQL login (required for grants/all)'
  type: string
  default: ''

- name: collectorLogin
  displayName: 'Collector SQL login (blank = use DBUSER)'
  type: string
  default: ''

# ADO Server 2022 RTW rejects a template expression on pool.name, so this is a
# literal. Demands are fine under a literal name.
#
# Pinned to Linux: the steps below are bash. Each Linux agent that can take
# the job needs Python 3.9+ (DEPLOY.md, phase 0). To pin a specific one:
#   - Agent.Name -equals <agent-name>
pool:
  name: DevopsAutomation
  demands:
  - Agent.OS -equals Linux

variables:
# Database credentials: the existing 'Dashboard DB' group, used as-is rather
# than copied, so the password lives in one place. The env block below maps
# its names. Needs DBINSTANCE, DBNAME, DBUSER, DBPASS.
- group: 'Dashboard DB'
# Shared with reports/gw-monthly-login-report.yaml ON PURPOSE. LOKI_PROJECT,
# LOGIN_USER_REGEX, REPORT_TIMEZONE, ENVS and PRODUCT_JOBS must be identical in
# both jobs or the dashboard silently stops reconciling with the spreadsheet --
# one group makes drift impossible. Collector-only settings (LOOKBACK_DAYS,
# DB_ENCRYPT, ...) all have working defaults; add them here only to
# override. The group also holds SMTP secrets; they are never mapped into this
# job's env, and ADO does not expose an unmapped secret to a script.
- group: 'gw-reports-secrets'

steps:
- checkout: self
  clean: true

# Find this folder in the repo instead of assuming where it lives: 'logins/'
# at the root of the GitHub repo, but it can sit deeper (e.g. Grafana/logins).
# Anchored on tools/prepare_python.sh, which an older copy of the folder lacks,
# so a stale duplicate elsewhere in the repo is never picked. To pin the folder
# explicitly, define a pipeline variable LOGINS_DIR.
- script: |
    dir="$LOGINS_DIR_PINNED"
    case "$dir" in '$'*) dir="" ;; esac     # an undefined variable arrives as a literal
    if [ -z "$dir" ]; then
      hits=`git ls-files -- '*tools/prepare_python.sh'`
      n=`printf '%s\n' "$hits" | grep -c .`
      if [ "$n" -eq 0 ]; then
        echo "##vso[task.logissue type=error]No tools/prepare_python.sh anywhere in this repo. Commit the whole logins folder -- git only picks up new files when you git add them."
        exit 1
      fi
      if [ "$n" -gt 1 ]; then
        echo "##vso[task.logissue type=error]Found $n copies of tools/prepare_python.sh: `echo $hits`. Delete the stale ones, or set a pipeline variable LOGINS_DIR to the folder to use."
        exit 1
      fi
      dir=`dirname "$hits"`
      dir=`dirname "$dir"`
    fi
    missing=""
    for f in collect_logins.py tools/prepare_python.sh tools/setup.py tools/gwcommon.py \
             sql/schema.sql sql/grants.sql sql/verify.sql; do
      [ -f "$dir/$f" ] || missing="$missing $dir/$f"
    done
    if [ -n "$missing" ]; then
      echo "##vso[task.logissue type=error]Missing from the checked-out repo:$missing -- commit them (new files need git add)."
      exit 1
    fi
    echo "logins folder  : $dir"
    echo "##vso[task.setvariable variable=LOGINS_DIR]$dir"
  displayName: 'Locate logins folder'
  workingDirectory: '$(Build.SourcesDirectory)'
  env:
    LOGINS_DIR_PINNED: $(LOGINS_DIR)

# UsePythonVersion@0 only searches the agent tool cache, so it fails on
# self-hosted agents even with Python installed. prepare_python.sh picks the
# newest python3 >= 3.9 on PATH, builds a job-local venv (avoids PEP 668 and
# old system pip), installs pymssql into it -- whose wheel carries its own SQL
# Server client, so no ODBC driver or admin install -- and sets
# $(PYTHON_EXE). It is a file rather than inline so ADO cannot macro-expand the
# $(...) inside it.
- script: bash "$(LOGINS_DIR)/tools/prepare_python.sh" "$(Agent.TempDirectory)"
  displayName: 'Prepare Python'
  workingDirectory: '$(Build.SourcesDirectory)'
  timeoutInMinutes: 15
  env:
    # Only needed when the agent can't reach PyPI (DEPLOY.md 0.4). Mapped
    # explicitly so a feed URL holding a credential can be a secret variable --
    # ADO never exposes a secret to a script unless it is mapped. Undefined ones
    # arrive as the literal $(NAME), which the script discards.
    PIP_INDEX_URL:       $(PIP_INDEX_URL)
    PIP_EXTRA_INDEX_URL: $(PIP_EXTRA_INDEX_URL)
    HTTPS_PROXY:         $(HTTPS_PROXY)

- script: >-
    "$(PYTHON_EXE)" "$(LOGINS_DIR)/tools/setup.py"
    --action ${{ parameters.action }}
    --grafana-login "${{ parameters.grafanaLogin }}"
    --collector-login "${{ parameters.collectorLogin }}"
    --sql-root "$(LOGINS_DIR)/sql"
  displayName: 'Setup: ${{ parameters.action }}'
  timeoutInMinutes: 20
  workingDirectory: '$(Build.SourcesDirectory)'
  env:
    # Secrets travel as environment variables, never as arguments -- the
    # command line is echoed into the build log.
    DB_SERVER:             $(DBINSTANCE)
    DB_NAME:               $(DBNAME)
    DB_USER:               $(DBUSER)
    DB_PASS:               $(DBPASS)
    DB_TRUSTED_CONNECTION: $(DB_TRUSTED_CONNECTION)
    DB_ENCRYPT:            $(DB_ENCRYPT)
    LOKI_URL:              $(LOKI_URL)
    LOKI_PROJECT:          $(LOKI_PROJECT)
    LOKI_VERIFY_TLS:       $(LOKI_VERIFY_TLS)
    LOKI_CA_BUNDLE:        $(LOKI_CA_BUNDLE)      # optional: internal CA .pem for Loki
    BYPASS_PROXY:          $(BYPASS_PROXY)
