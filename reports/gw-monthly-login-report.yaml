# Monthly Guidewire login report: Loki -> Excel -> email.
# PowerShell, so the agent needs no Python, pip or PSGallery access.

# NO schedules: block here on purpose.
#
# Defining schedules: in YAML makes ADO ignore any UI scheduled trigger for this
# pipeline. Leaving it out means the schedule is managed in the UI instead
# (Pipeline -> Edit -> ... -> Triggers -> Scheduled), which is easier to change
# and needs no commit. The pipeline needs no parameters for a scheduled run --
# a blank month means "current month" -- so a plain UI schedule is sufficient.

trigger: none
pr: none

name: 'GW-LoginReport-$(Date:yyyyMMdd).$(Rev:r)'

# Blank (the normal case) means the current month. Set it to back-fill.
parameters:
- name: agentPool
  displayName: 'Agent pool'
  type: string
  default: 'Default'      # pin to a consistent pool (proxy / TLS / SMTP behaviour
                          # varies per agent, so a fixed pool removes the variance)

- name: testMonth
  displayName: 'Month to report (YYYY-MM). Leave blank for the current month.'
  type: string
  default: ''

pool:
  name: ${{ parameters.agentPool }}

variables:
- group: 'gw-reports-secrets'       # create this Variable Group in Library (see README)

steps:
- checkout: self
  clean: true
  persistCredentials: false

- task: PowerShell@2
  displayName: 'Generate and email login report'
  inputs:
    targetType: filePath
    filePath: 'reports/monthly_report.ps1'
    errorActionPreference: stop
    failOnStderr: false
  env:
    # --- Loki ---
    LOKI_URL:        $(LOKI_URL)
    LOKI_VERIFY_TLS: $(LOKI_VERIFY_TLS)     # 'false' if the agent doesn't trust the cert
    LOKI_PROJECT:    $(LOKI_PROJECT)        # value of your Loki `project` label
    # --- SMTP ---
    SMTP_HOST: $(SMTP_HOST)
    SMTP_PORT: $(SMTP_PORT)
    SMTP_TLS:  $(SMTP_TLS)
    SMTP_USER: $(SMTP_USER)
    SMTP_PASS: $(SMTP_PASS)
    # --- Report ---
    FROM_ADDR: $(FROM_ADDR)
    TO_ADDRS:  $(TO_ADDRS)
    ENVS:      $(ENVS)                       # e.g. DEV1,QA7  (match Loki env label casing)
    PRODUCTS:  $(PRODUCTS)                   # e.g. pc   (or pc,bc,cc,cm)
    OUTPUT_DIR: '$(Build.ArtifactStagingDirectory)'
    TEST_MONTH: ${{ parameters.testMonth }}

# Keep a copy on the run for re-download.
- task: PublishBuildArtifacts@1
  displayName: 'Publish xlsx as build artifact'
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'monthly-report'
    publishLocation: 'Container'
